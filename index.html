<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logan's Briefs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F5F0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@800&family=Inter:wght@300;700&display=swap" rel="stylesheet">
<style>
/* BRAND: Logan Rhodes. #F7F5F0 / #1E1E1D, gold #D9A72E. Same system as every brief.
   IDEA: four pages held side by side; a Liquid Glass tab bar with one lens that glides between tabs.
   TYPE: three sizes. H1 = page titles (matches the briefs). H2 = sheet titles and card headlines. P = everything else.
   LAYOUT: standard status bar (app starts below it and runs to the bottom edge); floating glass dock above
   the home indicator; pages slide; dock shrinks while you scroll down. */
:root{--bg:#F7F5F0;--ink:#1E1E1D;--soft:#5d5c58;--gold:#D9A72E;--hair-d:rgba(247,245,240,.14);
  --h1:clamp(38px,6.4vw,60px);--h2:clamp(26px,3.6vw,34px);--p:16px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  --top-pad:calc(var(--safe-top) + 24px);--bar-gap:max(10px,calc(var(--safe-bot) - 12px));
  --app-h:100lvh;--glass:rgba(30,30,29,.66);--glass-edge:rgba(247,245,240,.22);--spring:cubic-bezier(.32,1.36,.56,1);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);overscroll-behavior:none}
body{color:var(--bg);font:300 var(--p)/1.55 Inter,-apple-system,sans-serif;letter-spacing:-.01em;overflow:hidden}
b{font-weight:700}.g{color:var(--gold)}
[hidden]{display:none!important}

/* App shell sized to the true screen */
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.page{position:absolute;inset:0;background:var(--bg);visibility:hidden;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.page.on{visibility:visible}
.page iframe{display:block;width:100%;height:100vh;border:0;background:var(--bg);overflow:hidden}
.state{position:absolute;inset:0;display:grid;place-items:center;padding:var(--top-pad) 32px 32px;text-align:center;color:var(--soft);background:var(--bg) radial-gradient(rgba(150,150,150,.28) 1px,transparent 1.2px) 0 0/26px 26px}
.state b{display:block;color:var(--ink)}

/* Liquid Glass: blurred, saturated backdrop + tint + specular edge + depth */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.12)}
.topfade{position:absolute;inset:0 0 auto 0;height:calc(var(--safe-top) + 34px);z-index:4;pointer-events:none;background:linear-gradient(to bottom,var(--bg) 0,var(--bg) var(--safe-top),rgba(247,245,240,.85) calc(var(--safe-top) + 10px),rgba(247,245,240,0) 100%)}

/* Dock */
.dock{position:absolute;left:0;right:0;bottom:var(--bar-gap);z-index:5;display:flex;justify-content:center;align-items:center;gap:10px;padding:0 16px;pointer-events:none;transition:transform .45s var(--spring)}
nav{pointer-events:auto;position:relative;display:flex;padding:5px;border-radius:999px;touch-action:none;transition:padding .35s var(--ease)}
nav button,.roundbtn{all:unset;cursor:pointer;position:relative;z-index:1;width:62px;height:52px;display:grid;place-items:center;border-radius:999px;color:rgba(247,245,240,.72);transition:color .3s,width .38s var(--ease),height .38s var(--ease),opacity .25s}
nav button[aria-current=true]{color:var(--gold)}
nav svg,.roundbtn svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--spring)}
nav button:active svg,.roundbtn:active svg{transform:scale(.86)}
nav .dot{position:absolute;top:9px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--gold)}
.lens{position:absolute;z-index:0;top:5px;left:0;width:62px;height:52px;transition:height .38s var(--ease),top .38s var(--ease);border-radius:999px;background:rgba(247,245,240,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.12),0 2px 10px rgba(0,0,0,.12);pointer-events:none;transform-origin:center}
nav.drag .lens{background:rgba(247,245,240,.24)}
.roundbtn{pointer-events:auto;width:62px;height:62px;transition:width .38s var(--ease),height .38s var(--ease),transform .35s var(--spring)}
.roundbtn.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.12)}
/* Minimized while scrolling down: only the current tab stays */
.dock.mini{transform:translateY(6px)}
.dock.mini nav{padding:3px}
.dock.mini nav button:not([aria-current=true]){width:0;height:48px;opacity:0;pointer-events:none}
.dock.mini nav button[aria-current=true]{width:48px;height:48px}
.dock.mini .lens{width:48px;height:48px;top:3px}
.dock.mini .roundbtn{width:54px;height:54px}
nav button:focus-visible,.roundbtn:focus-visible,.btn:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Today */
/* Today fits one screen: header on top, three cards share the rest, no scrolling */
.today{overflow-y:auto;color:var(--ink);background:var(--bg) radial-gradient(rgba(150,150,150,.28) 1px,transparent 1.2px) 0 0/26px 26px;padding:var(--top-pad) max(5vw,20px) calc(var(--bar-gap) + 84px)}
.today .wrap{max-width:1000px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.today h1{margin:10px 0 18px;flex:none}
.date{font-weight:700;display:flex;gap:8px}
h1{font:800 var(--h1)/1.05 "EB Garamond",Georgia,serif;letter-spacing:0;margin:10px 0 28px;max-width:21ch;text-wrap:balance}
h2{font:800 var(--h2)/1.1 "EB Garamond",Georgia,serif;letter-spacing:0;margin:0 0 6px}
/* One statement summarizing all three briefs. No clamping, so nothing is ever clipped. */
.wxart{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:0;overflow:visible}
.today .wrap{position:relative;z-index:1}
.summary{background:var(--ink);color:var(--bg);border-radius:25px;padding:22px 22px 20px;box-shadow:0 1px 2px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.08)}
.summary .say{font:800 var(--h2)/1.22 "EB Garamond",Georgia,serif;letter-spacing:0;margin:0;text-wrap:pretty}
.summary .say a{color:inherit;text-decoration:none;cursor:pointer}
.summary .say a b{color:var(--gold);font-weight:800}
.summary .say a:active{opacity:.6}
.summary .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair-d);color:rgba(247,245,240,.6)}
.summary .meta a{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:28px}
.summary .meta b{color:var(--bg);font-weight:700}
.summary .ndot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.today .foot{margin-top:26px;font-weight:700;color:var(--soft);display:flex;justify-content:space-between}
.sdg{color:var(--gold);letter-spacing:.12em}

/* Lock + sheet */
.lock{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:center;padding:var(--top-pad) max(5vw,20px) calc(var(--safe-bot) + 24px);background:var(--ink)}
.lock .wrap{max-width:460px;width:100%;margin:0 auto}
.dia{color:var(--gold);font-weight:700}
.muted{color:rgba(247,245,240,.65);margin:0 0 22px}
label{display:block;font-weight:700;margin-bottom:8px}
input{width:100%;font:400 16px Inter,sans-serif;padding:14px 16px;border-radius:14px;border:1px solid var(--hair-d);background:rgba(247,245,240,.06);color:var(--bg)}
.btn{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:700;margin-top:14px;transition:transform .3s var(--spring)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(247,245,240,.06);color:var(--bg);border:1px solid var(--hair-d)}
.err{color:var(--gold);font-weight:700;min-height:1.6em;margin-top:10px}
.sheet{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:flex-end;padding:0 10px var(--bar-gap);background:rgba(0,0,0,.28);transition:background .3s}
.sheet.closed{background:rgba(0,0,0,0);pointer-events:none}
.panel{border-radius:34px;padding:10px 22px 18px;max-height:80vh;overflow:auto;--glass:rgba(30,30,29,.74);transition:transform .45s var(--spring),opacity .25s}
.sheet.closed .panel{transform:translateY(110%);opacity:.6}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(247,245,240,.3);margin:0 auto 6px}
.sec{padding:18px 0;border-bottom:1px solid var(--hair-d)}
.sec:last-child{border-bottom:0}
.row{display:flex;flex-wrap:wrap;gap:10px}
textarea{width:100%;min-height:110px;font:400 13px ui-monospace,Menlo,monospace;padding:12px;border-radius:14px;border:1px solid var(--hair-d);background:rgba(247,245,240,.06);color:var(--bg);resize:vertical}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-today" viewBox="0 0 24 24"><path d="M12 3l6.5 9L12 21l-6.5-9z"/></symbol>
  <symbol id="i-daily" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></symbol>
  <symbol id="i-gym" viewBox="0 0 24 24"><rect x="4.5" y="7" width="3" height="10" rx="1"/><rect x="16.5" y="7" width="3" height="10" rx="1"/><path d="M2.5 10v4M21.5 10v4M7.5 12h9"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3.8 7l8.2 6 8.2-6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></symbol>
</svg>

<div id="app">
  <section class="page today" data-page="today"><canvas class="wxart" id="wxart" aria-hidden="true"></canvas><div class="wrap">
    <div class="date"><span class="g">◆</span><span id="tdate"></span></div>
    <h1 id="greet"></h1>
    <div class="summary" id="summary"></div>
  </div></section>
  <section class="page" data-page="daily"><iframe title="Daily brief" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe><div class="state"></div></section>
  <section class="page" data-page="gym"><iframe title="Gym brief" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe><div class="state"></div></section>
  <section class="page" data-page="inbox"><iframe title="Inbox brief" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe><div class="state"></div></section>

  <div class="topfade" aria-hidden="true"></div>
  <div class="dock" id="dock">
    <nav id="tabs" class="glass" aria-label="Briefs">
      <span class="lens" id="lens"></span>
      <button data-k="today" aria-label="Today"><svg><use href="#i-today"/></svg></button>
      <button data-k="daily" aria-label="Daily brief"><svg><use href="#i-daily"/></svg><i class="dot" id="d-daily" hidden></i></button>
      <button data-k="gym" aria-label="Gym brief"><svg><use href="#i-gym"/></svg><i class="dot" id="d-gym" hidden></i></button>
      <button data-k="inbox" aria-label="Inbox brief"><svg><use href="#i-inbox"/></svg><i class="dot" id="d-inbox" hidden></i></button>
    </nav>
    <button id="more" class="roundbtn glass" aria-label="Settings"><svg><use href="#i-more"/></svg></button>
  </div>
</div>

<div class="lock" id="lock" hidden><div class="wrap">
  <div class="dia">◆ Logan's Briefs</div>
  <h1>Your briefs, <span class="g">Logan.</span></h1>
  <p class="muted">Enter your passphrase once. It stays on this phone and unlocks your Daily, Gym and Inbox briefs.</p>
  <form id="unlock">
    <label for="pass">Passphrase</label>
    <input id="pass" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
    <button class="btn" type="submit">Unlock</button>
    <div class="err" id="perr" role="alert"></div>
  </form>
</div></div>

<div class="sheet closed" id="sheet" aria-hidden="true"><div class="panel glass" role="dialog" aria-label="Settings"><div class="grab"></div>
  <div class="sec">
    <h2>Notifications</h2>
    <p class="muted" id="nstat" style="margin-bottom:0"></p>
    <div class="row"><button class="btn" id="sub">Turn on notifications</button></div>
  </div>
  <div class="sec" id="subbox" hidden>
    <h2>Your phone's <span class="g">push code</span></h2>
    <p class="muted">Copy this and paste it to Claude in chat. It's how GitHub knows where to send your briefs.</p>
    <textarea id="subjson" readonly></textarea>
    <div class="row"><button class="btn" id="copy">Copy code</button></div>
  </div>
  <div class="sec">
    <h2>This phone</h2>
    <div class="row">
      <button class="btn ghost" id="reload">Refresh briefs</button>
      <button class="btn ghost" id="forget">Forget passphrase</button>
      <button class="btn ghost" id="close">Close</button>
    </div>
  </div>
</div></div>

<script>
{
const VAPID = 'BO_3X2huQ2a8WRKiPKwoQJAlZ4L6po2DdYPUs2ChwCf6q2SKjv8mdJFVs1BPgLnE_S2fmSjHB_iFKk20JI7v8Bo';
const KINDS = ['daily', 'gym', 'inbox'];
const ORDER = ['today', 'daily', 'gym', 'inbox'];
const $ = id => document.getElementById(id);
const page = k => document.querySelector(`.page[data-page="${k}"]`);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
let pass = store.get('briefs-pass');
const cache = {}, tpl = {}, rendered = {};
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

addEventListener('resize', () => placeLens(false));

// ---- Data
async function decrypt(env, pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(env.salt), iterations: 310000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(env.iv) }, key, ub(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function getEnv(k) { const r = await fetch('data/' + k + '.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw 0; return r.json(); }
async function getTpl(k) { if (!tpl[k]) tpl[k] = await (await fetch('templates/' + k + '.html')).text(); return tpl[k]; }
async function loadAll() {
  await Promise.all(KINDS.map(async k => {
    try { const env = await getEnv(k); if (!cache[k] || cache[k].env.updated !== env.updated) { cache[k] = { env }; rendered[k] = null; } }
    catch { delete cache[k]; }
  }));
  markDots();
}
async function dataFor(k) { const c = cache[k]; return c ? (c.data || (c.data = await decrypt(c.env, pass))) : null; }
function when(iso) {
  const d = new Date(iso); if (isNaN(d)) return '–';
  return new Date().toDateString() === d.toDateString() ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString([], { weekday: 'short' });
}
const seen = (k, iso) => store.get('seen-' + k) === iso;
function markDots() { KINDS.forEach(k => { const c = cache[k]; $('d-' + k).hidden = !c || seen(k, c.env.updated); }); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---- Brief pages: each brief keeps its own frame, so switching never reloads it.
function measure(prop) { const d = document.createElement('div'); d.style.cssText = 'position:fixed;visibility:hidden;padding-top:' + prop; document.body.appendChild(d); const v = parseFloat(getComputedStyle(d).paddingTop) || 0; d.remove(); return v; }
function frameExtras() {
  const top = measure('var(--safe-top)'), gap = measure('var(--bar-gap)');
  return '<style>html,body{overflow:hidden!important;height:auto!important}:root{padding:0!important;background:transparent}header.band{padding-top:' + (top + 24) + 'px!important}footer.band{padding-bottom:' + (gap + 110) + 'px!important}html{-webkit-text-size-adjust:100%}</style>' +
    '<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(a){a.target="_blank";a.rel="noopener"}},true);' +
    'function bg(el){while(el){var c=getComputedStyle(el).backgroundColor;if(c&&c!=="transparent"&&!/rgba\\([^)]*,\\s*0\\)/.test(c))return c;el=el.parentElement}return ""}' +
    'function h(){var b=document.body;parent.postMessage({briefHeight:Math.max(document.documentElement.scrollHeight,b?b.scrollHeight:0),top:bg(document.querySelector("header")||(b&&b.firstElementChild)),bottom:bg(document.querySelector("footer")||(b&&b.lastElementChild))},"*")}' +
    'addEventListener("load",h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.documentElement);if(document.fonts)document.fonts.ready.then(h);setTimeout(h,300);setTimeout(h,1500);<\/script>';
}
async function renderBrief(k) {
  const pg = page(k), frame = pg.querySelector('iframe'), st = pg.querySelector('.state');
  const c = cache[k];
  if (!c) { frame.hidden = true; st.hidden = false; st.innerHTML = '<div><b>No brief yet.</b>It shows up here after its next scheduled run.</div>'; return; }
  if (rendered[k] === c.env.updated) return;
  try {
    const data = await dataFor(k);
    frame.srcdoc = (await getTpl(k)).replace('<!--BRIEF-DATA-->', frameExtras() +
      '<script type="application/json" id="brief">' + JSON.stringify(data).replace(/</g, '\\u003c') + '<\/script>');
    frame.hidden = false; st.hidden = true; rendered[k] = c.env.updated;
  } catch {
    frame.hidden = true; st.hidden = false;
    st.innerHTML = '<div><b>Couldn’t unlock this brief.</b>The passphrase may have changed. Open More → Forget passphrase.</div>';
  }
}

// ---- Today
const LABEL = { daily: 'Daily Brief', gym: 'Gym Brief', inbox: 'Inbox Brief' };
const EMPTY = { daily: 'Arrives each morning around 7.', gym: 'Arrives each morning around 7.', inbox: 'Arrives each morning around 7.' };
function keyLine(k, d) {
  if (k === 'daily') { const w = d.weather || {}, n = (d.cal || []).length; return `<b>${esc(w.hi)}°</b> / ${esc(w.lo)}° · Rain ${esc(w.rain)}%` + (n ? ` · ${n} on the calendar` : ''); }
  if (k === 'gym') { if (d.rest) return '<b>Rest day</b> · No workout on the calendar'; return [`<b>${esc(d.session)}</b>`, esc(d.time), (d.plan || []).length ? d.plan.length + ' exercises' : ''].filter(Boolean).join(' · '); }
  const a = d.action || {}, total = (d.folders || []).reduce((s, x) => s + (x.items || []).length, 0);
  return (a.urgent ? `<b>${esc(a.text)}</b>` : 'Nothing urgent') + ` · ${total} filed` + ((d.inbox || []).length ? ` · ${d.inbox.length} left` : '');
}
function trimAccent(d) { const h = String(d.headline || ''), a = String(d.accent || ''); const t = a && h.startsWith(a) ? h.slice(a.length).trim() : h; return t || h; }
async function renderToday() {
  const hr = new Date().getHours();
  $('tdate').textContent = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }).replace(',', ' ·');
  $('greet').innerHTML = (hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening') + ', <span class="g">Logan.</span>';
  const get = async k => { if (!cache[k]) return null; try { return await dataFor(k); } catch { return null; } };
  const [dl, gy, ib] = await Promise.all(['daily', 'gym', 'inbox'].map(get));
  const parts = [];
  const link = (k, html) => `<a data-go="${k}">${html}</a>`;
  if (dl && dl.weather) {
    const w = dl.weather, cond = String(w.cond || '').split(',')[0].trim();
    const n = (dl.cal || []).length;
    parts.push(link('daily', `${esc(cond || 'Weather')}, high of <b>${esc(w.hi)}°</b>` + (+w.rain >= 30 ? ` with a ${esc(w.rain)}% chance of rain` : '') + '.' + (n ? ` ${n === 1 ? 'One thing' : esc(n) + ' things'} on the calendar.` : '')));
  }
  if (gy) parts.push(link('gym', gy.rest ? '<b>Rest day</b>, so recover and eat well.' : `<b>${esc(gy.session)}</b>${gy.time ? ' at ' + esc(gy.time) : ''}` + ((gy.plan || []).length ? `, ${gy.plan.length} exercises.` : '.')));
  if (ib) {

$('forget').addEventListener('click', () => {
  if (!forgetArmed) { $('forget').textContent = 'Tap again to forget'; forgetArmed = setTimeout(() => { forgetArmed = 0; $('forget').textContent = 'Forget passphrase'; }, 3000); return; }
  clearTimeout(forgetArmed); forgetArmed = 0; $('forget').textContent = 'Forget passphrase';
  store.del('briefs-pass'); pass = null; closeSheet(); KINDS.forEach(k => { if (cache[k]) cache[k].data = null; rendered[k] = null; }); start(); });

function b64u(s) { const p = '='.repeat((4 - s.length % 4) % 4); return ub((s + p).replace(/-/g, '+').replace(/_/g, '/')); }
$('sub').addEventListener('click', async () => {
  try {
    if (!isStandalone) { $('nstat').textContent = notifStatus(); return; }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { $('nstat').textContent = notifStatus(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (sub) { // signed up with an older key: drop it and sign up again
      const have = sub.options && sub.options.applicationServerKey, want = b64u(VAPID);
      const same = have && have.byteLength === want.length && new Uint8Array(have).every((v, i) => v === want[i]);
      if (!same) { await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID) });
    $('subjson').value = JSON.stringify(sub); $('subbox').hidden = false; $('nstat').textContent = notifStatus();
  } catch (err) { $('nstat').textContent = 'Couldn’t turn on notifications: ' + (err && err.message || err); }
});
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('subjson').value); $('copy').textContent = 'Copied'; }
  catch { $('subjson').select(); $('copy').textContent = 'Select all and copy'; }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', async e => {
    if (e.data && e.data.open) { const h = new URL(e.data.open).hash.slice(1); await loadAll(); go(h || 'today'); }
  });
}
start();
}
</script>
